[project]
name = "cc-models"
version = "0.1.4"
description = "CPA 模型目录选择器：Textual TUI + CLI（modelPicker 配置管理）"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
cc-models = "cc_models.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "pyright>=1.1.414", "packaging>=24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cc_models"]

[tool.hatch.build.targets.sdist]
# 显式白名单：仅发布必要文件，排除 .jj/.git/.agents/.pi/venv/缓存等本机元数据
include = [
    "/src",
    "/tests",
    "/scripts",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
    "/.gitignore",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "basic"
pythonVersion = "3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Domain/state validation intentionally raises semantic CoreError subclasses
# (StateError etc.), never bare TypeError.
"src/cc_models/store.py" = ["TRY004"]
# Textual declares BINDINGS as a mutable class attribute by framework convention.
"src/cc_models/app.py" = ["RUF012"]
